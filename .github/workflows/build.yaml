name: "build"

on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  darwin_arm64:
    runs-on: "macos-26"
    steps:
      - uses: "actions/checkout@v6"
      - uses: "jdx/mise-action@v4"
      - name: "Build"
        run: "mise run build"
  linux_x64:
    runs-on: "ubuntu-26.04"
    steps:
      - uses: "actions/checkout@v6"
      - uses: "jdx/mise-action@v4"
      - name: "Build"
        run: "mise run build"
  linux_arm64:
    runs-on: "ubuntu-26.04-arm"
    steps:
      - uses: "actions/checkout@v6"
      - uses: "jdx/mise-action@v4"
      - name: "Build"
        run: "mise run build"
  windows_x64:
    runs-on: "windows-2025"
    steps:
      - uses: "actions/checkout@v6"
      - uses: "jdx/mise-action@v4"
      - name: "Build"
        run: "mise run build"
  windows_arm64:
    runs-on: "windows-11-arm"
    steps:
      - uses: "actions/checkout@v6"
      - uses: "jdx/mise-action@v4"
      - name: "Build"
        run: "mise run build"
