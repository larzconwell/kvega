name: "checks"

on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v6"
      - uses: "jdx/mise-action@v4"
      - name: "Build"
        run: "mise run build"
  test:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v6"
      - uses: "jdx/mise-action@v4"
      - name: "Test"
        run: "mise run test"
      - name: "Test with race detector enabled"
        run: "mise run testrace"
  lint:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v6"
      - uses: "jdx/mise-action@v4"
      - name: "Lint"
        run: "mise run lint"
