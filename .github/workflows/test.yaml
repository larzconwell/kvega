name: "test"

on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  darwin_arm64:
    runs-on: "macos-26"
    steps:
      - uses: "actions/checkout@v6"
      - uses: "jdx/mise-action@v4"
      - name: "Test"
        run: "mise run test"
      - name: "Test with race detector enabled"
        run: "mise run testrace"
  linux_x64:
    runs-on: "ubuntu-26.04"
    steps:
      - uses: "actions/checkout@v6"
      - uses: "jdx/mise-action@v4"
      - name: "Test"
        run: "mise run test"
      - name: "Test with race detector enabled"
        run: "mise run testrace"
  linux_arm64:
    runs-on: "ubuntu-26.04-arm"
    steps:
      - uses: "actions/checkout@v6"
      - uses: "jdx/mise-action@v4"
      - name: "Test"
        run: "mise run test"
      - name: "Test with race detector enabled"
        run: "mise run testrace"
  windows_x64:
    runs-on: "windows-2025"
    steps:
      - uses: "actions/checkout@v6"
      - uses: "jdx/mise-action@v4"
      - name: "Test"
        run: "mise run test"
      - name: "Test with race detector enabled"
        run: "mise run testrace"
  windows_arm64:
    runs-on: "windows-11-arm"
    steps:
      - uses: "actions/checkout@v6"
      - uses: "jdx/mise-action@v4"
      - name: "Test"
        run: "mise run test"
      # testrace cannot work on windows_arm64 due to Go limitations
